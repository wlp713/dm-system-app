name: Publish DM preview
on:
  push:
    branches: [main, feature/field-ready-workflow]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export:web
      - run: mkdir -p publish/app && cp -R site/. publish/ && cp -R dist/. publish/app/ && touch publish/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish
      - id: deployment
        uses: actions/deploy-pages@v4
